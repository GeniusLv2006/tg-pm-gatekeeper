name: Weekly audit

# Re-audits main against newly published advisories. Findings open or update an
# issue instead of failing, so an advisory published after merge never marks an
# already-merged commit red. Pushes and pull requests still run these checks as
# blocking jobs in ci.yml; keep the steps here in sync with its dependencies and
# image jobs.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Audit runtime dependencies
        id: runtime
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          require-hashes: true
          no-deps: true
          vulnerability-service: osv
      - name: Audit build dependencies
        id: build
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-build.txt
          require-hashes: true
          no-deps: true
          vulnerability-service: osv
      - name: Build image
        id: image-build
        continue-on-error: true
        run: docker build --tag tg-pm-gatekeeper:audit .
      - name: Scan image for fixable high-severity vulnerabilities
        id: image-scan
        if: steps.image-build.outcome == 'success'
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: tg-pm-gatekeeper:audit
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Open, update, or close the audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNTIME: ${{ steps.runtime.outcome }}
          BUILD: ${{ steps.build.outcome }}
          IMAGE_BUILD: ${{ steps.image-build.outcome }}
          IMAGE_SCAN: ${{ steps.image-scan.outcome }}
        run: |
          set -euo pipefail
          title="Weekly audit found problems on main"

          failed=""
          [ "$RUNTIME" = success ] || failed+="- runtime dependencies (\`requirements.txt\`)"$'\n'
          [ "$BUILD" = success ] || failed+="- build dependencies (\`requirements-build.txt\`)"$'\n'
          [ "$IMAGE_BUILD" = success ] || failed+="- Docker image build"$'\n'
          [ "$IMAGE_SCAN" != failure ] || failed+="- Docker image scan"$'\n'

          # Only reuse an issue this workflow opened; anyone can open issues on a public repository.
          issue=$(gh issue list --state open --limit 100 --json number,title,author \
            --jq ".[] | select(.author.login == \"app/github-actions\" and .title == \"$title\") | .number" | head -n 1)

          if [ -n "$failed" ]; then
            body="The weekly audit of \`main\` at $COMMIT found problems in:"$'\n\n'"$failed"$'\n'
            body+="Details: $RUN_URL"$'\n\n'
            body+="Resolve findings through a pull request as described in docs/RELEASE.md, after checking whether Dependabot has already opened one. This issue closes automatically when a later audit passes."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body" --assignee "$OWNER"
            fi
            echo "::warning::Weekly audit found problems; see the audit issue."
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The weekly audit of \`main\` at $COMMIT passed: $RUN_URL"
          fi
