version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        patterns:
          - ruff
          - setuptools
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - ruff
          - setuptools
          # Telegram layer changes can silently alter message parsing; review alone.
          - telethon
          - Telethon
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Python minor upgrades (including pre-releases) must also change requires-python.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
